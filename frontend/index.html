<!doctype html>
<html lang="en">
  <head>
    <!-- Basic -->
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Omkar Gavade — Full Stack &amp; AI Software Engineer | React, Node.js, TypeScript</title>

    <meta
      name="description"
      content="Omkar Gavade is a full stack and AI software engineer in India. Projects include Lumora (RAG document chat) and NexusAI. React, Node.js, TypeScript. Resume and contact."
    />

    <meta name="author" content="Omkar Gavade" />
    <meta
      name="robots"
      content="index, follow, max-image-preview:large, max-snippet:-1"
    />

    <!-- Canonical -->
    <link rel="canonical" href="https://www.omkargavade.xyz/" />

    <!-- Icons -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="48x48" href="/favicon-48.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />

    <!-- Theme Color -->
    <meta
      name="theme-color"
      content="#ffffff"
      media="(prefers-color-scheme: light)"
    />
    <meta
      name="theme-color"
      content="#000000"
      media="(prefers-color-scheme: dark)"
    />

    <!-- Open Graph -->
    <meta property="og:type" content="profile" />
    <meta property="profile:first_name" content="Omkar" />
    <meta property="profile:last_name" content="Gavade" />
    <meta property="og:site_name" content="Omkar Gavade" />
    <meta property="og:locale" content="en_IN" />
    <meta
      property="og:title"
      content="Omkar Gavade — Full Stack &amp; AI Software Engineer"
    />
    <meta
      property="og:description"
      content="Portfolio of Omkar Gavade: Lumora (RAG document chat), NexusAI (multi-model AI workspace) and more, built with React, Node.js and TypeScript."
    />
    <meta property="og:url" content="https://www.omkargavade.xyz/" />
    <meta
      property="og:image"
      content="https://www.omkargavade.xyz/og-card.jpg"
    />
    <meta
      property="og:image:secure_url"
      content="https://www.omkargavade.xyz/og-card.jpg"
    />
    <meta property="og:image:type" content="image/jpeg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="Omkar Gavade — Full Stack &amp; AI Software Engineer"
    />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta
      name="twitter:title"
      content="Omkar Gavade — Full Stack &amp; AI Software Engineer"
    />
    <meta
      name="twitter:description"
      content="Portfolio of Omkar Gavade: Lumora, NexusAI and more, built with React, Node.js and TypeScript."
    />
    <meta
      name="twitter:image"
      content="https://www.omkargavade.xyz/og-card.jpg"
    />
    <meta
      name="twitter:image:alt"
      content="Omkar Gavade — Full Stack &amp; AI Software Engineer"
    />

    <!-- Structured data: generated from src/data at build time (scripts/prerender.mjs) -->
    <!--structured-data-->

    <!-- Prevent theme flash -->
    <script>
      (function () {
        try {
          if (localStorage.getItem("theme") === "dark") {
            document.documentElement.classList.add("dark");
          }
        } catch (e) {}
      })();
    </script>
  </head>

  <body>
    <div id="root"><!--app-html--></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
