<!doctype html>
<html lang="en">
  <head>
    <!-- Basic -->
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Omkar Gavade | Full Stack Developer | React, Node.js, MongoDB & AWS</title>

    <meta
      name="description"
      content="Omkar Gavade is a Full Stack Developer specializing in React.js, Node.js, Express.js, MongoDB, Docker, AWS, and modern web development. Explore projects, skills, experience, certifications, and contact information."
    />

    <meta
      name="keywords"
      content="Omkar Gavade, Full Stack Developer, React.js, Node.js, Express.js, MongoDB, Mongoose, JavaScript, Tailwind CSS, Docker, AWS EC2, GitHub Actions, MERN Stack, Portfolio"
    />

    <meta name="author" content="Omkar Gavade" />
    <meta name="robots" content="index, follow, max-image-preview:large" />

    <!-- Canonical -->
    <link rel="canonical" href="https://www.omkargavade.xyz/" />

    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <!-- Theme Color -->
    <meta
      name="theme-color"
      content="#ffffff"
      media="(prefers-color-scheme: light)"
    />
    <meta
      name="theme-color"
      content="#000000"
      media="(prefers-color-scheme: dark)"
    />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Omkar Gavade" />
    <meta
      property="og:title"
      content="Omkar Gavade | Full Stack Developer"
    />
    <meta
      property="og:description"
      content="Full Stack Developer specializing in React.js, Node.js, Express.js, MongoDB, Docker, AWS and modern web development."
    />
    <meta property="og:url" content="https://www.omkargavade.xyz/" />

    <meta
      property="og:image"
      content="https://www.omkargavade.xyz/og-image.png"
    />
    <meta
      property="og:image:secure_url"
      content="https://www.omkargavade.xyz/og-image.png"
    />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="Omkar Gavade Portfolio Website"
    />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta
      name="twitter:title"
      content="Omkar Gavade | Full Stack Developer"
    />
    <meta
      name="twitter:description"
      content="Explore the portfolio of Omkar Gavade, a Full Stack Developer specializing in React.js, Node.js, MongoDB, Docker and AWS."
    />
    <meta
      name="twitter:image"
      content="https://www.omkargavade.xyz/og-image.png"
    />
    <meta
      name="twitter:image:alt"
      content="Omkar Gavade Portfolio Website"
    />

    <!-- Structured Data -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Person",
      "name": "Omkar Gavade",
      "url": "https://www.omkargavade.xyz/",
      "image": "https://www.omkargavade.xyz/og-image.png",
      "jobTitle": "Full Stack Developer",
      "description": "Full Stack Developer specializing in React.js, Node.js, Express.js, MongoDB, Docker and AWS.",
      "sameAs": [
        "https://github.com/Omkar-Gavade",
        "YOUR_LINKEDIN_PROFILE_URL"
      ]
    }
    </script>

    <!-- Prevent theme flash -->
    <script>
      (function () {
        try {
          if (localStorage.getItem("theme") === "dark") {
            document.documentElement.classList.add("dark");
          }
        } catch (e) {}
      })();
    </script>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
